<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<mat-dialog-content>
  <p>{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="warn" [mat-dialog-close]="true">{{ datos.textoBoton }}</button>
</mat-dialog-actions>
